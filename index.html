<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡4 Meses Juntos! ❤️</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Banner Principal -->
  <header class="hero">
    <h1>¡Felices 4 Meses, Mi Vida! 🎉💖</h1>
    <p>Un pequeño regalo adelantado para el chico más especial del mundo</p>
  </header>

  <!-- Contador -->
  <section class="contador-container">
    <h2>Nuestro Tiempo Juntos ⏳</h2>
    <div id="contador">Cargando nuestro tiempo...</div>
  </section>

  <!-- Galería de Fotos -->
  <section class="galeria">
    <h2>Nuestros Momentos Favoritos 📸</h2>
    <div class="grid-fotos">
      <div class="polaroid">
        <img src="foto1.jpg" alt="Momento juntos">
        <p>Nuestro primer mes 💕</p>
      </div>
      <div class="polaroid">
        <img src="foto2.jpg" alt="Momento juntos">
        <p>Risas inolvidables ✨</p>
      </div>
      <!-- Agrega más fotos según quieras -->
    </div>
  </section>

  <!-- Botón Sorpresa para la Carta -->
  <section class="carta-seccion">
    <button id="btnCarta">Toca aquí para leer tu regalo 💌</button>
    <div id="mensajeOculto" class="oculto">
      <p>¡Aquí va todo tu texto romántico lleno de amor para Juan! 💖✨</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
